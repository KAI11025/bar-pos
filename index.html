<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J角 點單收銀</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J角">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e5f73">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 首頁是桌位圖：點空桌直接點餐，點有人的桌打開那張單。結帳是獨立全螢幕，分開付就點他要付的品項。 */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f3f5f7; --ink:#1b2430; --ink-2:#56626f; --line:#d8dee4;
  --accent:#0e5f73; --accent-ink:#ffffff; --accent-soft:#d9ecf0; --stamp:#c23a2e; --ok:#2a7d4f; --ok-soft:#dcefe3; --warn:#a05a00; --warn-soft:#f6e7d2;
  --shadow:0 1px 2px rgba(20,30,40,.08);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419; --surface:#171e26; --surface-2:#1e2731; --ink:#e8edf2; --ink-2:#9aa7b4; --line:#2b3541;
    --accent:#4cc0d6; --accent-ink:#06222a; --accent-soft:#16363f; --stamp:#ef6a5c; --ok:#5cc48a; --ok-soft:#173326; --warn:#e0a24a; --warn-soft:#3a2c17;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419; --surface:#171e26; --surface-2:#1e2731; --ink:#e8edf2; --ink-2:#9aa7b4; --line:#2b3541;
  --accent:#4cc0d6; --accent-ink:#06222a; --accent-soft:#16363f; --stamp:#ef6a5c; --ok:#5cc48a; --ok-soft:#173326; --warn:#e0a24a; --warn-soft:#3a2c17;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:0 96px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2);font-size:13px}

.top{position:sticky;top:0;z-index:10;background:var(--bg);margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 22px/1.2 var(--serif);letter-spacing:.04em}
.brand span{font-size:13px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.big{min-height:54px;width:100%;font-size:17px}
.btn.small{min-height:40px;padding:0 12px}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:8px 4px;min-height:40px;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.mini{min-height:30px;padding:0 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 12px;background:var(--surface)}
.seg button{flex:1;min-height:46px;background:none;border:0;color:var(--ink-2);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

main{padding-block:14px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin-bottom:12px;color:var(--ink-2)}
.empty{text-align:center;padding:36px 8px;color:var(--ink-2)}
.empty h2{font:700 18px var(--serif);color:var(--ink);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font:700 16px var(--serif);letter-spacing:.04em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 8px}
.sec h2{margin:0;font:700 15px var(--serif);letter-spacing:.06em;color:var(--ink-2)}

/* 桌位圖 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tt{position:relative;min-height:84px;border:1px dashed var(--line);border-radius:10px;background:transparent;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-2)}
.tt b{font:700 19px/1.1 var(--serif);color:var(--ink);overflow-wrap:anywhere;text-align:center}
.tt small{font-size:12px;line-height:1.2;text-align:center}
.tt.busy{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.tt.busy .amt{font-weight:700;font-size:15px}
.tt.add{border-style:dashed;color:var(--accent);font-weight:700}
.tt .pend{color:#fff;background:var(--warn);border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;margin-top:2px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 2px;min-height:48px}
.prow:first-child{border-top:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px dashed var(--line)}
.legend i.b{border:2px solid var(--accent);background:var(--accent-soft)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--ink-2);font-weight:500;font-size:14px;padding:0 2px;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;line-height:18px;margin-left:2px}

/* 全螢幕：點餐、結帳 */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.overlay[hidden]{display:none}
.ov-in{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.ed-top{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbtn{flex:1;min-width:0;font:700 19px var(--serif);justify-content:flex-start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cotitle{flex:1;min-width:0;font:700 19px var(--serif);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gnote{margin:8px 16px 0;padding:8px 10px;border-radius:6px;background:var(--warn-soft);font-size:14px}
.gnote[hidden]{display:none}
.ed-tools{padding:8px 16px 0}
.ed-tools input[type=search]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;margin-bottom:8px}
#ed-scroll{flex:1;overflow:auto;padding:4px 16px 16px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{position:relative;text-align:left;min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.tile b{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.tile small{color:var(--ink-2);font-size:12px;overflow-wrap:anywhere}
.tile .pr{font-weight:700}
.tile .pr.none{color:var(--warn);font-weight:500}
.tile .cnt{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tile.off{opacity:.45}
.tile .ty{position:absolute;top:6px;right:8px;font-size:11px;color:var(--ink-2)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px;margin-bottom:10px}
.inline[hidden]{display:none}
.inline input,.inline select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.cart{border-top:1px solid var(--line);background:var(--surface);padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.carthead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 0 6px;text-align:left;position:sticky;top:0;background:var(--surface);z-index:1}
.carthead .cn{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.carthead b{font:700 22px var(--serif)}
.carthead .tg{font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.cline .nm{overflow-wrap:anywhere;min-width:0}
.cline .nm small{display:block;color:var(--ink-2)}
.cline.paidall .nm b{text-decoration:line-through;color:var(--ink-2);font-weight:400}
.svchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:12px;padding:2px 8px;margin-top:2px}
.svchip.done{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.step{display:inline-flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:20px;line-height:1}
.step span{min-width:26px;text-align:center;font-weight:700}
.cart textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;margin:8px 0;resize:none}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:4px 0 8px}
.ctotal b{font:700 24px var(--serif)}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}

/* 結帳 */
.co-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 16px 0}
.co-sum div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.co-sum small{display:block;color:var(--ink-2);font-size:12px}
.co-sum b{font-size:17px}
.co-mode{display:flex;gap:8px;padding:10px 16px 0}
.co-mode button{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.co-mode button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.co-hint{padding:8px 16px 0;color:var(--ink-2);font-size:14px}
#co-scroll{flex:1;overflow:auto;padding:6px 16px 12px;min-height:0}
.unit{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;margin-bottom:6px;min-height:50px}
.unit .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
.unit.sel{border-color:var(--accent);background:var(--accent-soft)}
.unit.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.paidbox{margin-top:14px}
.paidbox .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.paidbox .pl{color:var(--ink-2);padding:2px 0 2px 26px;font-size:14px}
.paidbox .pl s{color:var(--ink-2)}
.ok{color:var(--ok);font-weight:700}
.co-foot{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.psum{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.psum b{font:700 30px var(--serif)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.mgrid button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.mgrid button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cashrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cashrow[hidden]{display:none}
.cashrow input{width:110px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:18px}
.change{font-weight:700;font-size:17px;margin-left:auto}
.done-card{text-align:center;padding:30px 10px}
.done-card .big{font:700 34px var(--serif);color:var(--ok)}

/* 出餐 */
.sv{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.sv.alldone{opacity:.6}
.svh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px 6px}
.svh h3{margin:0;font:700 19px/1.2 var(--serif)}
.wait{font-size:13px;color:var(--ink-2)}
.svnote{padding:0 14px 6px;font-size:14px;color:var(--warn)}
.svl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;min-height:54px;font-size:17px}
.svl .q{font-weight:700;min-width:36px}
.svl .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.svl .go{font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.svl.done .nm,.svl.done .q{text-decoration:line-through;color:var(--ink-2)}
.svl.done .go{color:var(--ink-2);font-weight:400}
.svfoot{border-top:1px solid var(--line);padding:8px 14px}

/* 備忘 */
.noteadd{display:flex;gap:8px;margin-bottom:12px}
.noteadd input{flex:1;min-width:0;min-height:50px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:17px}
.nrow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:4px 0}
.nrow:first-child{border-top:0}
.nrow .nt{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;min-height:50px;padding:0;font-size:17px;min-width:0}
.nrow .box{flex:0 0 26px;height:26px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent}
.nrow.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.nrow.done .tx{text-decoration:line-through;color:var(--ink-2)}
.nrow .tx{overflow-wrap:anywhere;min-width:0}
.nrow small{color:var(--ink-2);font-size:12px;white-space:nowrap}
.xbtn{width:40px;height:40px;border:0;background:none;color:var(--ink-2);font-size:20px}

/* 營業額 */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi small{display:block;color:var(--ink-2);font-size:12px}
.kpi b{font-size:20px}
.big-total{font:700 40px/1.1 var(--serif);margin:2px 0}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .lab{flex:1;text-align:center;font-weight:700}
.mline{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rank{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}

/* 設定 */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.mrow .en{font-size:13px;color:var(--ink-2)}
.mrow .ctl{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow.off input{opacity:.55}
.rrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rrow input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.catname{font:700 15px var(--serif);margin:14px 0 2px;color:var(--ink-2);letter-spacing:.06em}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form-grid input,.form-grid select,.form-grid textarea{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
.form-grid textarea{padding:10px;min-height:80px}
.form-grid .full{grid-column:1 / -1}

.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5)}
.sheet-back[hidden],.sheet[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:760px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font:700 18px var(--serif)}
.sheet .lab{font-size:13px;color:var(--ink-2);margin:12px 0 6px}
.sheet input.txt{width:100%;min-height:50px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;margin:0 0 8px;font-size:17px}
.sheet .tt{min-height:60px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);font-weight:500}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

#login input[hidden]{display:none}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login[hidden]{display:none}
.lcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lcard h1{font:700 26px var(--serif);margin:0}
.lcard input{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:16px}
.lerr{color:var(--stamp);margin:0}
</style>
<script>window.POSDB=new Promise(function(r){window.__resolveDB=r;});</script>
<script type="module" src="db.js"></script>
</head>
<body>

<div id="login" hidden>
  <form id="login-form" class="lcard">
    <h1>J角 點單收銀</h1>
    <p class="muted">輸入店內密碼，每支手機只要輸入一次就會記住。</p>
    <input id="login-email" type="email" autocomplete="username" placeholder="店帳號 email" aria-label="email" required>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="店內密碼" aria-label="店內密碼" required>

<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var METHODS=['現金','LINE Pay','街口','信用卡','轉帳','其他'];
var DEFAULT_TABLES=['A1','A2','A4','B1','B2','B4','B5','B6','B7','B8','B9','C1','C2','C4','左包','右包'];
var OLD_DEFAULT='吧台,1,2,3,4,5,6,7,8,外帶';
var FOOD_CATS=['炸物','下酒菜','主食','餐點','食物','小點'];

/*PURE*/
var pad2=function(n){return String(n).padStart(2,'0');};
var bizDay=function(ts){var d=new Date((ts==null?Date.now():ts)-6*36e5);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
var shiftDay=function(day,n){var p=day.split('-').map(Number);var dt=new Date(p[0],p[1]-1,p[2]+n,12);return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());};
var WD=['日','一','二','三','四','五','六'];
var fmtDay=function(day){var p=day.split('-').map(Number);var dt=new Date(p[0],p[1]-1,p[2],12);return p[1]+'/'+p[2]+' 週'+WD[dt.getDay()];};
var money=function(n){n=Math.round(n||0);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US');};
var norm=function(s){return String(s==null?'':s).trim().toLowerCase();};
var fmtTable=function(t){t=String(t||'').trim();if(!t)return '未命名';return /^\d+$/.test(t)?'桌 '+t:t;};
var tableOf=function(o){return o.table||o.label||'';};
var kindOf=function(o){return o.kind==='person'?'person':'table';};
var labelOf=function(o){return kindOf(o)==='person'?(tableOf(o)||'未命名'):fmtTable(tableOf(o));};
var orderTotal=function(o){return (o.items||[]).reduce(function(s,l){return s+l.price*l.qty;},0);};
var paidAmount=function(o){return (o.payments||[]).reduce(function(s,p){return s+p.amount;},0);};
var paidQtyMap=function(o){var m={};(o.payments||[]).forEach(function(p){(p.lines||[]).forEach(function(l){m[l.lineId]=(m[l.lineId]||0)+l.qty;});});return m;};
var remainingQty=function(o){var m=paidQtyMap(o);return (o.items||[]).reduce(function(s,l){return s+Math.max(0,l.qty-(m[l.id]||0));},0);};
var isClosed=function(o){return (o.items||[]).length>0&&remainingQty(o)===0;};
var noServe=function(l){return l.t==='none'||l.price<0;};
var pendingQty=function(o){return (o.items||[]).reduce(function(s,l){return noServe(l)?s:s+Math.max(0,l.qty-Math.min(l.qty,l.sv||0));},0);};
var payDaysOf=function(payments){var d=[];payments.forEach(function(p){var k=bizDay(p.at);if(d.indexOf(k)<0)d.push(k);});return d;};
// 桌號分區：A1→A 區、左包→包廂，其他→其他
var groupOf=function(t){var m=/^([A-Za-z]+)/.exec(String(t).trim());if(m)return m[1].toUpperCase()+' 區';if(String(t).indexOf('包')>=0)return '包廂';return '其他';};
function groupTables(list){var out=[],idx={};list.forEach(function(t){var g=groupOf(t);if(!(g in idx)){idx[g]=out.length;out.push({name:g,tables:[]});}out[idx[g]].tables.push(t);});return out;}
function dayStats(orders,day){
  var byMethod={},items={},total=0,units=0,seen={};
  orders.forEach(function(o){(o.payments||[]).forEach(function(p){
    if(bizDay(p.at)!==day)return;
    total+=p.amount;byMethod[p.method]=(byMethod[p.method]||0)+p.amount;seen[o.id]=1;
    (p.lines||[]).forEach(function(l){
      if(!l.menuId)return;
      var it=items[l.name]||(items[l.name]={name:l.name,qty:0,amount:0});
      it.qty+=l.qty;it.amount+=l.price*l.qty;units+=l.qty;
    });
  });});
  var count=Object.keys(seen).length;
  return {total:total,count:count,units:units,avg:count?total/count:0,byMethod:byMethod,
    top:Object.keys(items).map(function(k){return items[k];}).sort(function(a,b){return b.qty-a.qty||b.amount-a.amount;})};
}
/*END*/

var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);};
var fmtTime=function(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes());};
var clone=function(x){return JSON.parse(JSON.stringify(x));};

var S={db:null,state:'connecting',menu:{items:[]},menuMap:{},menuLoaded:false,regs:[],settings:{},settingsLoaded:false,
  open:[],openLoaded:false,pend:[],days:{},notes:[],notesLoaded:false,
  view:'tables',svType:'drink',svBy:(function(){try{return localStorage.getItem('pos.svBy')||'seat';}catch(x){return 'seat';}})(),salesDay:bizDay(),setSec:'menu',
  editor:null,co:null,tsheet:null,psheet:null,confirm:null,menuQ:''};
var tablesList=function(){var t=S.settings&&S.settings.tables;return (t&&t.length)?t:DEFAULT_TABLES;};

function itemType(m){return m.type||(FOOD_CATS.indexOf(m.cat)>=0?'food':'drink');}
function lineType(l){
  if(l.t)return l.t;
  if(l.price<0)return 'none';
  var m=l.menuId&&S.menuMap[l.menuId];
  return m?itemType(m):'drink';
}
function pendingOfType(o,type){
  return (o.items||[]).reduce(function(s,l){return (noServe(l)||lineType(l)!==type)?s:s+Math.max(0,l.qty-Math.min(l.qty,l.sv||0));},0);
}
function findOrder(id){
  if(!id)return null;
  var o=S.open.find(function(x){return x.id===id;});if(o)return o;
  o=S.pend.find(function(x){return x.id===id;});if(o)return o;
  var keys=Object.keys(S.days);
  for(var i=0;i<keys.length;i++){var f=S.days[keys[i]].orders.find(function(x){return x.id===id;});if(f)return f;}
  return null;
}
function eachCopy(id,fn){
  S.open.concat(S.pend).forEach(function(o){if(o.id===id)fn(o);});
  Object.keys(S.days).forEach(function(k){S.days[k].orders.forEach(function(o){if(o.id===id)fn(o);});});
}
// 本機先更新：開著的單、待出餐清單
function syncLocal(o){
  var open=o.status!=='paid',serving=!!o.serving;
  var inOpen=S.open.some(function(x){return x.id===o.id;}),inPend=S.pend.some(function(x){return x.id===o.id;});
  if(open&&!inOpen)S.open.push(clone(o));
  if(!open&&inOpen)S.open=S.open.filter(function(x){return x.id!==o.id;});
  if(serving&&!inPend)S.pend.push(clone(o));
  if(!serving&&inPend)S.pend=S.pend.filter(function(x){return x.id!==o.id;});
}
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2800);}
function w(fn){
  if(!S.db){toast('沒有連到資料庫，無法儲存');return Promise.resolve();}
  return Promise.resolve().then(fn).catch(function(e){console.error(e);toast('沒有存成功（'+((e&&e.code)||'錯誤')+'），請再試一次');});
}
function arm(key,ms){S.confirm=key;clearTimeout(arm.t);arm.t=setTimeout(function(){S.confirm=null;rerenderConfirmable();},ms||4000);}
function rerenderConfirmable(){
  if(S.editor)renderEditorCart();
  if(S.co)renderCo();
  if(!S.editor&&!S.co)renderMain();
}

/* ---------- 資料連線 ---------- */
function ensureDay(day){
  if(!S.db||S.days[day])return;
  var rec={orders:[],loaded:false};S.days[day]=rec;
  S.db.collection('orders').where('payDays','array-contains',day).onSnapshot(function(q){
    rec.orders=q.docs.map(function(d){var x=d.data();x.id=d.id;return x;});rec.loaded=true;
    syncEditor();if(S.co)renderCo();
    renderMain();
  },function(e){console.error(e);});
}
function startDb(db){
  S.db=db;S.state='ready';
  db.doc('menu/main').onSnapshot(function(s){
    var d=s.exists?s.data():null;
    S.menu={items:(d&&d.items)||[]};S.menuMap={};S.menu.items.forEach(function(m){S.menuMap[m.id]=m;});S.menuLoaded=true;
    if(S.editor)renderEditorPicker();
    renderMain();
  },function(e){console.error(e);});
  db.doc('regulars/main').onSnapshot(function(s){
    var d=s.exists?s.data():null;S.regs=(d&&d.list)||[];
    if(S.psheet)renderP();if(S.tsheet)renderT();if(S.editor)renderEditorTop();
    if(S.view==='settings')renderMain();
  },function(e){console.error(e);});
  db.doc('settings/main').onSnapshot(function(s){
    S.settings=s.exists?(s.data()||{}):{};S.settingsLoaded=true;
    var t=S.settings.tables;
    if(t&&t.join(',')===OLD_DEFAULT){S.settings={tables:DEFAULT_TABLES};w(function(){return db.doc('settings/main').set({tables:DEFAULT_TABLES,updatedAt:Date.now()});});}
    if(S.tsheet)renderT();
    renderMain();
  },function(e){console.error(e);});
  db.collection('orders').where('status','==','open').onSnapshot(function(q){
    S.open=q.docs.map(function(d){var x=d.data();x.id=d.id;return x;});S.openLoaded=true;
    syncEditor();if(S.co)renderCo();if(S.tsheet)renderT();
    renderMain();renderTabs();
  },function(e){console.error(e);});
  db.collection('orders').where('serving','==',true).onSnapshot(function(q){
    S.pend=q.docs.map(function(d){var x=d.data();x.id=d.id;return x;});
    syncEditor();renderTabs();
    if(S.view==='serve'||S.view==='tables')renderMain();
  },function(e){console.error(e);});
  db.collection('notes').onSnapshot(function(q){
    S.notes=q.docs.map(function(d){var x=d.data();x.id=d.id;return x;});S.notesLoaded=true;
    renderTabs();if(S.view==='notes')renderMain();
  },function(e){console.error(e);});
  ensureDay(bizDay());
  render();
}

/* ---------- 熟客 ---------- */
function saveRegs(list){
  S.regs=list;
  if(S.view==='settings')renderMain();
  w(function(){return S.db.doc('regulars/main').set({list:list,updatedAt:Date.now()});});
}
function addRegular(name){
  var ex=S.regs.find(function(r){return norm(r.name)===norm(name);});
  if(ex)return ex.id;
  var id=uid();saveRegs(S.regs.concat([{id:id,name:name,note:'',last:Date.now()}]));return id;
}
function touchReg(rid){var list=clone(S.regs),r=list.find(function(x){return x.id===rid;});if(r){r.last=Date.now();saveRegs(list);}}
function sortedRegs(){return S.regs.slice().sort(function(a,b){return (b.last||0)-(a.last||0);});}
function regChips(q,selId,act){
  q=norm(q);
  return sortedRegs().filter(function(r){return !q||norm(r.name).indexOf(q)>=0;}).slice(0,12)
    .map(function(r){return '<button class="chip'+(selId===r.id?' on':'')+'" data-act="'+act+'" data-id="'+esc(r.id)+'">'+esc(r.name)+'</button>';}).join('');
}
function ridOf(o){return o.rid||(o.guests&&o.guests[0]&&o.guests[0].rid)||null;}

/* ---------- 畫面 ---------- */
var TITLES={tables:'桌位',serve:'出餐',notes:'備忘',sales:'營業額',settings:'設定'};
function render(){renderHeader();renderMain();renderTabs();}
function renderHeader(){
  $('#title').textContent=TITLES[S.view]||'J角';
  $('#dayline').textContent='J角 · 營業日 '+fmtDay(bizDay());
  $('#btn-new').hidden=S.view!=='tables';
}
function servingTotals(){
  var seen={},d=0,f=0;
  S.open.concat(S.pend).forEach(function(o){if(seen[o.id])return;seen[o.id]=1;d+=pendingOfType(o,'drink');f+=pendingOfType(o,'food');});
  return {drink:d,food:f};
}
function renderTabs(){
  var st=servingTotals(),pn=st.drink+st.food;
  var nn=S.notes.filter(function(n){return !n.done;}).length;
  var badge=function(n){return n?'<span class="n num">'+n+'</span>':'';};
  var tabs=[['tables','桌位',''],['serve','出餐',badge(pn)],['notes','備忘',badge(nn)],['sales','營業額',''],['settings','設定','']];
  $('#tabs').innerHTML=tabs.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'"'+(S.view===t[0]?' aria-current="page"':'')+'>'+t[1]+t[2]+'</button>';}).join('');
}
function renderMain(){
  var el=$('#main');
  var banner=S.state==='none'?'<div class="banner">沒有連到資料庫。請確認網路，並登入店裡的帳號。</div>':'';
  var v=S.view,h;
  if(v==='tables')h=tablesView();
  else if(v==='serve')h=serveView();
  else if(v==='notes')h=notesView();
  else if(v==='sales')h=salesView();
  else h=settingsView();
  // 備忘輸入框打字中就不要重畫，避免打到一半被洗掉
  var ni=$('#note-input'),keep=ni&&document.activeElement===ni?ni.value:null;
  el.innerHTML=banner+h;
  if(keep!==null&&$('#note-input')){$('#note-input').value=keep;$('#note-input').focus();}
  renderHeader();
}

/* ----- 桌位 ----- */
function tableOrders(t){return S.open.filter(function(o){return kindOf(o)==='table'&&norm(tableOf(o))===norm(t);});}
function tileBody(orders){
  var due=orders.reduce(function(s,o){return s+orderTotal(o)-paidAmount(o);},0);
  var pq=orders.reduce(function(s,o){return s+pendingQty(o);},0);
  return '<span class="amt num">'+money(due)+'</span>'+(pq?'<span class="pend num">待出 '+pq+'</span>':'');
}
function tablesView(){
  if(!S.openLoaded&&S.state==='ready')return '<div class="empty muted">讀取中…</div>';
  var list=tablesList(),known={};list.forEach(function(t){known[norm(t)]=1;});
  var h='';
  groupTables(list).forEach(function(g){
    h+='<div class="sec"><h2>'+esc(g.name)+'</h2></div><div class="tgrid">'+g.tables.map(function(t){
      var os=tableOrders(t);
      if(!os.length)return '<button class="tt" data-act="tableTap" data-v="'+esc(t)+'"><b>'+esc(fmtTable(t))+'</b><small>空桌</small></button>';
      return '<button class="tt busy" data-act="tableTap" data-v="'+esc(t)+'"><b>'+esc(fmtTable(t))+'</b>'+tileBody(os)+'</button>';
    }).join('')+'</div>';
  });
  // 人名單，加上桌位清單外的舊單
  var others=S.open.filter(function(o){return kindOf(o)==='person'||!known[norm(tableOf(o))];}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
  h+='<div class="sec"><h2>人名單（熟客）</h2></div><div class="tgrid">'+others.map(function(o){
    return '<button class="tt busy" data-act="orderOpen" data-id="'+esc(o.id)+'"><b>'+esc(labelOf(o))+'</b>'+tileBody([o])+'</button>';
  }).join('')+'<button class="tt add" data-act="personNew"><b style="color:inherit">＋</b><small>熟客</small></button></div>';
  h+='<div class="legend"><span><i></i>空桌，點了直接點餐</span><span><i class="b"></i>有人，點了打開那張單</span></div>';
  // 今日已結帳
  var today=bizDay(),rec=S.days[today]||{orders:[]};
  var paid=rec.orders.filter(function(o){return o.status==='paid';}).sort(function(a,b){return (b.closedAt||0)-(a.closedAt||0);});

    }).join('')+'</div>';

/* ----- 出餐：按座位 / 按品項 ----- */
var lineDone=function(l){return Math.min(l.qty,l.sv||0)>=l.qty;};
function serveOrders(type){
  var seen={},list=[];
  S.open.concat(S.pend).forEach(function(o){if(seen[o.id])return;seen[o.id]=1;
    if((o.items||[]).some(function(l){return !noServe(l)&&lineType(l)===type;}))list.push(o);});
  return list.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
}
function svRow(o,l,label){
  var sv=Math.min(l.qty,l.sv||0),done=sv>=l.qty;
  return '<button class="svl'+(done?' done':'')+'" data-act="svLine" data-oid="'+esc(o.id)+'" data-id="'+esc(l.id)+'">'+
    '<span class="q num">×'+l.qty+'</span><span class="nm">'+label+(sv&&!done?' <small class="muted">（已出 '+sv+'）</small>':'')+'</span>'+
    '<span class="go">'+(done?'↩ 還原':'出了 ✓')+'</span></button>';
}
function serveCard(o,type){
  var lines=(o.items||[]).filter(function(l){return !noServe(l)&&lineType(l)===type;});
  var pend=lines.filter(function(l){return !lineDone(l);});
  var rows=lines.slice().sort(function(a,b){return (lineDone(a)?1:0)-(lineDone(b)?1:0);}).map(function(l){return svRow(o,l,esc(l.name));}).join('');
  return '<section class="sv'+(pend.length?'':' alldone')+'"><div class="svh"><h3>'+esc(labelOf(o))+'</h3>'+
    (pend.length?'':'<span class="wait">都出了</span>')+'</div>'+
    (o.note?'<div class="svnote">備註：'+esc(o.note)+'</div>':'')+rows+
    (pend.length>1?'<div class="svfoot"><button class="btn small" data-act="svAll" data-oid="'+esc(o.id)+'">這桌'+(type==='food'?'餐點':'飲品')+'全部出了</button></div>':'')+'</section>';
}
// 同一個品項跨桌合在一起：A1、C1 都點長島，就一起調
function itemGroups(type){
  var g={},order=[];
  serveOrders(type).forEach(function(o){
    (o.items||[]).forEach(function(l){
      if(noServe(l)||lineType(l)!==type)return;
      var k=l.menuId||('n:'+l.name);
      if(!g[k]){g[k]={key:k,name:l.name,entries:[],first:Infinity};order.push(k);}
      g[k].entries.push({o:o,l:l});
      if(!lineDone(l))g[k].first=Math.min(g[k].first,l.at||o.createdAt||0);
    });
  });
  return order.map(function(k){var x=g[k];x.left=x.entries.reduce(function(s,e){return s+e.l.qty-Math.min(e.l.qty,e.l.sv||0);},0);return x;})
    .sort(function(a,b){return (a.left?0:1)-(b.left?0:1)||a.first-b.first;});
}
function itemCard(g,type){
  var unit=type==='food'?'份':'杯';
  var pendN=g.entries.filter(function(e){return !lineDone(e.l);}).length;
  var rows=g.entries.slice().sort(function(a,b){return (lineDone(a.l)?1:0)-(lineDone(b.l)?1:0);}).map(function(e){
    return svRow(e.o,e.l,'<b>'+esc(labelOf(e.o))+'</b>'+(e.o.note?' <small class="muted">'+esc(e.o.note)+'</small>':''));
  }).join('');
  return '<section class="sv'+(g.left?'':' alldone')+'"><div class="svh"><h3>'+esc(g.name)+'</h3>'+
    '<span class="wait num">'+(g.left?'還要 '+g.left+' '+unit:'都出了')+'</span></div>'+rows+
    (pendN>1?'<div class="svfoot"><button class="btn small primary" data-act="svItem" data-k="'+esc(g.key)+'">一起出了（'+g.left+' '+unit+'）</button></div>':'')+'</section>';
}
function serveView(){
  var st=servingTotals(),type=S.svType,by=S.svBy;
  var h='<div class="seg"><button class="'+(type==='drink'?'on':'')+'" data-act="svSeg" data-v="drink">飲品'+(st.drink?'（'+st.drink+'）':'')+'</button>'+
    '<button class="'+(type==='food'?'on':'')+'" data-act="svSeg" data-v="food">食物'+(st.food?'（'+st.food+'）':'')+'</button></div>'+
    '<div class="chips" style="margin-top:-4px"><button class="chip mini'+(by==='seat'?' on':'')+'" data-act="svBy" data-v="seat">按座位</button><button class="chip mini'+(by==='item'?' on':'')+'" data-act="svBy" data-v="item">按品項（同樣的一起做）</button></div>';
  if(!S.openLoaded&&S.state==='ready')return h+'<div class="empty muted">讀取中…</div>';
  var what=type==='food'?'餐點':'飲品';
  if(by==='item'){
    var gs=itemGroups(type);
    if(!gs.length)return h+'<div class="empty"><h2>現在沒有'+what+'要出</h2></div>';
    return h+'<p class="muted" style="margin:0 0 10px">同一個品項的各桌排在一起，可以一次做。出了點那一桌劃掉，或按「一起出了」。</p>'+gs.map(function(g){return itemCard(g,type);}).join('');
  }
  var list=serveOrders(type).sort(function(a,b){return (pendingOfType(a,type)>0?0:1)-(pendingOfType(b,type)>0?0:1);});
  if(!list.length)return h+'<div class="empty"><h2>現在沒有'+what+'要出</h2><p>點單後會排在這裡，出了就點一下劃掉。</p></div>';
  return h+'<p class="muted" style="margin:0 0 10px">先點的排上面。出了就點那一行劃掉，按錯再點一次還原。劃掉的會留著，直到那桌結帳。</p>'+list.map(function(o){return serveCard(o,type);}).join('');
}
// changes: { orderId: 'toggle:<lineId>' | ['lineId',...] (全部標成已出) | '*'(這個類別全部) }
function markServed(orderId,spec,type){
  var o=findOrder(orderId);if(!o)return null;
  var items=clone(o.items||[]),undone=null;
  items.forEach(function(l){
    if(spec==='*'){if(!noServe(l)&&lineType(l)===type)l.sv=l.qty;}
    else if(Array.isArray(spec)){if(spec.indexOf(l.id)>=0)l.sv=l.qty;}
    else if(l.id===spec){if(lineDone(l)){l.sv=0;undone=l;}else l.sv=l.qty;}
  });
  var serving=pendingQty({items:items})>0;
  eachCopy(orderId,function(x){x.items=clone(items);x.serving=serving;});
  var c=clone(o);c.items=items;c.serving=serving;syncLocal(c);
  w(function(){return S.db.doc('orders/'+orderId).update({items:items,serving:serving});});
  return undone;
}
function afterServe(msg){renderTabs();renderMain();syncEditor();if(msg)toast(msg);}

function notesView(){
  var h='<div class="noteadd"><input id="note-input" placeholder="缺什麼？例如：檸檬、冰塊、吸管" aria-label="新增備忘" autocomplete="off" enterkeyhint="done"><button class="btn primary" data-act="noteAdd">加入</button></div>';
  if(!S.notesLoaded&&S.state==='ready')return h+'<div class="empty muted">讀取中…</div>';
  var todo=S.notes.filter(function(n){return !n.done;}).sort(function(a,b){return (b.at||0)-(a.at||0);});
  var done=S.notes.filter(function(n){return n.done;}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  var row=function(n){
    var when=n.done?(n.doneAt?'處理 '+fmtTime(n.doneAt):''):(n.at?fmtTime(n.at):'');
    return '<div class="nrow'+(n.done?' done':'')+'"><button class="nt" data-act="noteToggle" data-id="'+esc(n.id)+'"><span class="box">✓</span><span class="tx">'+esc(n.text)+'</span></button>'+
      '<small class="num">'+when+'</small>'+(n.done?'<button class="xbtn" data-act="noteDel" data-id="'+esc(n.id)+'" aria-label="刪除">×</button>':'')+'</div>';
  };
  if(!todo.length&&!done.length)return h+'<div class="empty"><h2>目前沒有要補的東西</h2><p>缺什麼打在上面，所有登入店帳號的手機都會同步看到。補好了點一下劃掉。</p></div>';
  h+='<div class="card" style="padding:4px 14px">'+(todo.length?todo.map(row).join(''):'<p class="muted">都處理好了 👍</p>')+'</div>';
  if(done.length){
    h+='<div class="sec"><h2>已處理（'+done.length+'）</h2><button class="link" data-act="noteClear">'+(S.confirm==='noteClear'?'再按一次全部清掉':'清掉已處理')+'</button></div>'+
      '<div class="card" style="padding:4px 14px">'+done.map(row).join('')+'</div>';
  }
  return h;
}
function addNote(){
  var inp=$('#note-input');if(!inp)return;

  var loc=clone(n);loc.id=ref.id;S.notes.push(loc);renderMain();renderTabs();

function touch(){var E=S.editor;E.dirty=true;clearTimeout(E.timer);E.timer=setTimeout(flushEditor,500);}
function flushEditor(){
  var E=S.editor;if(!E||!E.dirty)return Promise.resolve();
  clearTimeout(E.timer);E.dirty=false;
  var d=E.draft,serving=pendingQty({items:d.items})>0;
  if(!E.id){
    if(!d.items.length)return Promise.resolve();
    var ref=S.db.collection('orders').doc();E.id=ref.id;
    var no={kind:d.kind,table:d.table,rid:d.rid||null,note:d.note||'',items:clone(d.items),payments:[],payDays:[],status:'open',serving:serving,createdAt:Date.now(),closedAt:null};
    var loc=clone(no);loc.id=ref.id;syncLocal(loc);
    renderMain();renderTabs();
    return w(function(){return ref.set(no);});
  }
  var o=findOrder(E.id)||{payments:[]};
  var closed=isClosed({items:d.items,payments:o.payments||[]});
  var upd={kind:d.kind,table:d.table||'未命名',rid:d.rid||null,note:d.note||'',items:clone(d.items),
    status:closed?'paid':'open',closedAt:closed?(o.closedAt||Date.now()):null,serving:serving};
  eachCopy(E.id,function(x){Object.keys(upd).forEach(function(k){x[k]=clone(upd[k]);});});
  var c=clone(o);Object.keys(upd).forEach(function(k){c[k]=clone(upd[k]);});c.id=E.id;syncLocal(c);
  renderTabs();
  var id=E.id;
  return w(function(){return S.db.doc('orders/'+id).update(upd);});
}
function closeEditor(){
  var E=S.editor;if(!E)return;
  var o=editorOrder();
  // 東西全刪光、也沒收過錢的單，關掉時順便刪掉，桌子就空出來
  if(E.id&&!E.draft.items.length&&!(o.payments||[]).length){
    var id=E.id;clearTimeout(E.timer);
    S.open=S.open.filter(function(x){return x.id!==id;});S.pend=S.pend.filter(function(x){return x.id!==id;});
    w(function(){return S.db.doc('orders/'+id).delete();});
  }else flushEditor();
  S.editor=null;$('#editor').hidden=true;S.confirm=null;
  S.view='tables';render();
}
function addLine(l){
  var E=S.editor,it=E.draft.items;
  var ex=l.menuId?it.find(function(x){return x.menuId===l.menuId&&x.price===l.price&&!x.g;}):null;
  var pm=paidQtyMap({payments:editorOrder().payments||[]});
  // 已經付過的那一行不要再加上去，另開一行，才不會把已付的東西算進新的
  if(ex&&(pm[ex.id]||0)>0)ex=null;
  if(ex){ex.qty++;ex.at=Date.now();}
  else it.push({id:uid(),menuId:l.menuId||null,name:l.name,price:l.price,qty:1,sv:0,t:l.t||'drink',at:Date.now()});
  touch();renderEditor();
}

function changeQty(lineId,d){
  var E=S.editor,it=E.draft.items,i=it.findIndex(function(x){return x.id===lineId;});if(i<0)return;
  var pq=paidQtyMap(editorOrder())[lineId]||0;

  if(nq<=0)it.splice(i,1);else{it[i].qty=nq;it[i].sv=Math.min(it[i].sv||0,nq);if(d>0)it[i].at=Date.now();}

function mergeInto(tgtId){

    var srcId=E.id,tgt=findOrder(tgtId);if(!tgt)return;

    var items=clone(tgt.items||[]).concat(clone(E.draft.items).map(function(l){delete l.g;return l;}));
    var note=[tgt.note,E.draft.note].filter(Boolean).join('；');
    var upd={items:items,note:note,status:'open',serving:pendingQty({items:items})>0,closedAt:null};

    if(srcId){S.open=S.open.filter(function(x){return x.id!==srcId;});S.pend=S.pend.filter(function(x){return x.id!==srcId;});}

    w(function(){var ops=[S.db.doc('orders/'+tgtId).update(upd)];if(srcId)ops.push(S.db.doc('orders/'+srcId).delete());return Promise.all(ops);});

/* ---------- 結帳 ---------- */
function openCheckout(){

    if(!E.id){toast('還沒點東西');return;}
    var o=findOrder(E.id);if(!o)return;

function remainingMap(o){var pm=paidQtyMap(o),r={};(o.items||[]).forEach(function(l){r[l.id]=Math.max(0,l.qty-(pm[l.id]||0));});return r;}
function selectAll(){var C=S.co,o=findOrder(C.id);if(!o)return;C.sel=remainingMap(o);C.mode='all';}
function coAmount(o,C){return (o.items||[]).reduce(function(s,l){return s+l.price*(C.sel[l.id]||0);},0);}
function renderCo(){
  var C=S.co;if(!C)return;
  var o=findOrder(C.id);if(!o)return;
  var rem=remainingMap(o),total=orderTotal(o),paid=paidAmount(o),closed=isClosed(o);
  // 清掉已經不存在或已付掉的選取
  Object.keys(C.sel).forEach(function(k){C.sel[k]=Math.min(C.sel[k],rem[k]||0);});
  $('#co-title').textContent='結帳 · '+labelOf(o);
  $('#co-sum').innerHTML='<div><small>全部</small><b class="num">'+money(total)+'</b></div><div><small>已付</small><b class="num">'+money(paid)+'</b></div><div><small>還沒付</small><b class="num">'+money(total-paid)+'</b></div>';
  var units='';
  (o.items||[]).forEach(function(l){
    for(var k=0;k<(rem[l.id]||0);k++){
      var on=k<(C.sel[l.id]||0);
      units+='<button class="unit'+(on?' sel':'')+'" data-act="coUnit" data-id="'+esc(l.id)+'" data-k="'+k+'"><span class="ck">✓</span><span>'+esc(l.name)+'</span><b class="num">'+money(l.price)+'</b></button>';
    }
  });
  var paidHtml='';
  if((o.payments||[]).length){
    paidHtml='<div class="paidbox"><div class="muted" style="margin-bottom:4px">已經付的（劃掉的）</div>'+o.payments.map(function(p,i){
      var a=S.confirm==='undo:'+i;
      return '<div class="ph"><span class="ok">✓ '+fmtTime(p.at)+' · '+esc(p.method)+' · <span class="num">'+money(p.amount)+'</span></span>'+
        '<button class="link" data-act="coUndo" data-v="'+i+'"'+(a?' style="color:var(--stamp)"':'')+'>'+(a?'再按一次撤銷':'撤銷')+'</button></div>'+
        (p.lines||[]).map(function(l){return '<div class="pl"><s>'+esc(l.name)+(l.qty>1?' ×'+l.qty:'')+'</s> <span class="num">'+money(l.price*l.qty)+'</span></div>';}).join('');
    }).join('')+'</div>';
  }
  if(closed){
    $('#co-mode').innerHTML='';$('#co-hint').textContent='';
    $('#co-list').innerHTML='<div class="done-card"><div class="big">✓ 付清了</div><p class="muted">要改的話，可以撤銷下面的收款。</p></div>'+paidHtml;
    $('#co-foot').hidden=true;
    return;
  }
  $('#co-foot').hidden=false;
  $('#co-mode').innerHTML='<button class="'+(C.mode==='all'?'on':'')+'" data-act="coAll">整桌一起付</button><button class="'+(C.mode==='split'?'on':'')+'" data-act="coSplit">分開付</button>';
  $('#co-hint').textContent=C.mode==='split'?'問他要付哪些，點那幾樣（藍色的就是這次要收的）。收完會劃掉，其他人繼續付。':'全部都選好了，選付款方式就能收。要分開付就按「分開付」。';
  $('#co-list').innerHTML=(units||'<p class="muted">沒有還沒付的品項。</p>')+paidHtml;
  var amt=coAmount(o,C),n=Object.keys(C.sel).reduce(function(s,k){return s+(C.sel[k]||0);},0);
  $('#co-amt').textContent=money(amt);
  $('#co-even').textContent=(C.mode==='all'&&amt>0)?'平分參考：2 人 '+money(Math.ceil(amt/2))+' · 3 人 '+money(Math.ceil(amt/3))+' · 4 人 '+money(Math.ceil(amt/4)):(n?'選了 '+n+' 樣':'');
  $('#co-methods').innerHTML=METHODS.map(function(m){return '<button class="'+(C.method===m?'on':'')+'" data-act="coMethod" data-v="'+esc(m)+'">'+esc(m)+'</button>';}).join('');
  var cash=C.method==='現金';
  $('#co-cash').hidden=!cash;
  if(cash){
    $('#co-quick').innerHTML=[['剛好',amt],['500',500],['1000',1000],['2000',2000]].filter(function(x,i){return i===0||x[1]>=amt;}).slice(0,3).map(function(x){return '<button class="chip mini" data-act="coQuick" data-v="'+x[1]+'">'+x[0]+'</button>';}).join('');
    var t=Number(C.tendered)||0;
    $('#co-change').textContent=C.tendered===''?'':(t>=amt?'找 '+money(t-amt):'還差 '+money(amt-t));
  }
  var short=cash&&C.tendered!==''&&(Number(C.tendered)||0)<amt;
  var b=$('#co-confirm');
  b.disabled=!n||!C.method||short;
  b.textContent=!n?'先點要收的品項':(!C.method?'選付款方式':(short?'金額不夠':'收款 '+money(amt)+' · '+C.method));
}
function coPay(){
  var C=S.co;if(!C)return;
  var o=findOrder(C.id);if(!o||!C.method)return;
  var lines=(o.items||[]).filter(function(l){return C.sel[l.id]>0;}).map(function(l){
    return {lineId:l.id,menuId:l.menuId||null,name:l.name,price:l.price,qty:C.sel[l.id]};});
  if(!lines.length)return;
  var amount=lines.reduce(function(s,l){return s+l.price*l.qty;},0);
  var pay={at:Date.now(),method:C.method,amount:amount,lines:lines};
  if(C.method==='現金'&&C.tendered!=='')pay.tendered=Number(C.tendered);
  var payments=(o.payments||[]).concat([pay]);
  var closed=isClosed({items:o.items,payments:payments});
  var payDays=payDaysOf(payments);
  var upd={payments:payments,payDays:payDays,status:closed?'paid':'open',closedAt:closed?pay.at:null};
  var id=C.id;
  eachCopy(id,function(x){x.payments=clone(payments);x.payDays=payDays;x.status=upd.status;x.closedAt=upd.closedAt;});
  var c=clone(o);c.payments=payments;c.payDays=payDays;c.status=upd.status;c.closedAt=upd.closedAt;syncLocal(c);
  var rec=S.days[bizDay(pay.at)];
  if(rec&&!rec.orders.some(function(x){return x.id===id;}))rec.orders.push(clone(c));
  var change=pay.tendered!=null&&pay.tendered>amount?'，找 '+money(pay.tendered-amount):'';
  w(function(){return S.db.doc('orders/'+id).update(upd);});
  if(closed){
    S.co=null;$('#checkout').hidden=true;
    if(S.editor){clearTimeout(S.editor.timer);S.editor=null;$('#editor').hidden=true;}
    S.view='tables';render();
    toast(labelOf(o)+' 結清了 ✓ '+C.method+' '+money(amount)+change);
  }else{
    C.sel={};C.method=null;C.tendered='';C.mode='split';$('#co-tendered').value='';
    renderCo();if(S.editor)renderEditorCart();renderMain();
    toast('收了 '+money(amount)+'（'+pay.method+'）'+change+'，還剩 '+money(orderTotal(c)-paidAmount(c)));
  }
}
function coUndo(idx){
  var C=S.co;if(!C)return;
  var key='undo:'+idx;
  if(S.confirm!==key){arm(key,4000);renderCo();return;}
  S.confirm=null;
  var o=findOrder(C.id);if(!o||!o.payments||!o.payments[idx])return;
  var removed=o.payments[idx];
  var payments=o.payments.filter(function(p,i){return i!==idx;}),payDays=payDaysOf(payments);
  var upd={payments:payments,payDays:payDays,status:'open',closedAt:null};
  eachCopy(o.id,function(x){x.payments=clone(payments);x.payDays=payDays;x.status='open';x.closedAt=null;});
  var c=clone(o);c.payments=payments;c.payDays=payDays;c.status='open';c.closedAt=null;syncLocal(c);
  var rec=S.days[bizDay(removed.at)];
  if(rec&&!payments.some(function(p){return bizDay(p.at)===bizDay(removed.at);}))rec.orders=rec.orders.filter(function(x){return x.id!==o.id;});
  selectAll();C.mode='split';C.sel={};
  renderCo();if(S.editor)renderEditorCart();renderMain();
  toast('已撤銷 '+removed.method+' '+money(removed.amount));
  w(function(){return S.db.doc('orders/'+o.id).update(upd);});
}
function closeCo(){S.co=null;S.confirm=null;$('#checkout').hidden=true;if(S.editor){syncEditor();renderEditorCart();}}

/* ---------- 菜單編輯 ---------- */
function saveMenu(items){
  S.menu={items:items};S.menuMap={};items.forEach(function(m){S.menuMap[m.id]=m;});
  renderMain();if(S.editor)renderEditorPicker();
  w(function(){return S.db.doc('menu/main').set({items:items,updatedAt:Date.now()});});
}
function mutItem(id,fn){
  var items=clone(menuItems()),m=items.find(function(x){return x.id===id;});if(!m)return;
  fn(m,items);saveMenu(items);
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  var a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  switch(a){
    case 'tab':S.view=v;S.confirm=null;render();window.scrollTo(0,0);break;
    case 'tableTap':tapTable(v);break;
    case 'orderOpen':closeK();openEditor(id);break;
    case 'closeK':closeK();break;
    case 'personNew':openP();break;
    case 'closeP':closeP();break;
    case 'pReg':{var r=S.regs.find(function(x){return x.id===id;});if(r){S.psheet.name=r.name;S.psheet.rid=r.id;$('#p-name').value=r.name;renderP();}break;}
    case 'pSave':S.psheet.save=!S.psheet.save;renderP();break;
    case 'pOk':personOk();break;
    case 'closeEditor':closeEditor();break;
    case 'tableOpen':openT();break;
    case 'closeT':closeT();break;
    case 'tPick':pickTable(v);break;
    case 'tCancel':S.tsheet.target=null;renderT();break;
    case 'tMerge':if(S.tsheet&&S.tsheet.target)mergeInto(S.tsheet.target);break;
    case 'tReg':{var r2=S.regs.find(function(x){return x.id===id;});if(r2){S.tsheet.name=r2.name;S.tsheet.rid=r2.id;$('#t-name').value=r2.name;renderT();}break;}
    case 'tNameOk':renameTo();break;
    case 'edCat':S.editor.cat=v;renderEditorPicker();$('#ed-scroll').scrollTop=0;break;
    case 'edAdd':addMenu(id);break;
    case 'edInc':changeQty(id,1);break;
    case 'edDec':changeQty(id,-1);break;
    case 'edSv':{
      var it0=S.editor.draft.items.find(function(x){return x.id===id;});
      if(it0){it0.sv=Math.min(it0.qty,it0.sv||0)>=it0.qty?0:it0.qty;touch();renderEditorCart();}
      break;}
    case 'askOk':{
      var price=$('#ed-ask-price').value;if(price===''||Number(price)<0){toast('請輸入價格');break;}
      var mid=S.editor.ask,pr=Math.round(Number(price));
      $('#ed-ask').hidden=true;S.editor.ask=null;
      mutItem(mid,function(m){m.price=pr;});
      var m2=S.menuMap[mid];
      if(m2)addLine({menuId:m2.id,name:m2.name,price:pr,t:itemType(m2)});
      break;}
    case 'askCancel':$('#ed-ask').hidden=true;S.editor.ask=null;break;
    case 'customOpen':$('#ed-custom').hidden=false;$('#ed-cname').focus();break;
    case 'customCancel':$('#ed-custom').hidden=true;break;
    case 'customOk':{
      var nm=$('#ed-cname').value.trim(),pv=$('#ed-cprice').value,ty=$('#ed-ctype').value;
      if(!nm||pv===''){toast('請輸入品名和金額');break;}
      var pn=Math.round(Number(pv));
      addLine({menuId:null,name:nm,price:pn,t:pn<0?'none':ty});
      $('#ed-cname').value='';$('#ed-cprice').value='';$('#ed-custom').hidden=true;break;}
    case 'cartToggle':S.editor.cartOpen=!S.editor.cartOpen;renderEditorCart();break;
    case 'delOrder':deleteOrder();break;
    case 'checkout':openCheckout();break;
    case 'coClose':closeCo();break;
    case 'coAll':selectAll();renderCo();break;
    case 'coSplit':S.co.mode='split';S.co.sel={};renderCo();break;
    case 'coUnit':{
      var C=S.co,k=Number(t.dataset.k),cur=C.sel[id]||0;
      C.sel[id]=k<cur?cur-1:cur+1;
      var o=findOrder(C.id),rem=remainingMap(o),all=Object.keys(rem).every(function(x){return (C.sel[x]||0)===rem[x];});
      C.mode=all?'all':'split';
      renderCo();break;}
    case 'coMethod':S.co.method=v;renderCo();break;
    case 'coQuick':S.co.tendered=String(v);$('#co-tendered').value=v;renderCo();break;
    case 'coPay':coPay();break;
    case 'coUndo':coUndo(Number(v));break;
    case 'svSeg':S.svType=v;renderMain();break;
    case 'svLine':{var u=markServed(t.dataset.oid,id,S.svType);afterServe(u?'已還原：'+u.name:'');break;}
    case 'svAll':markServed(t.dataset.oid,'*',S.svType);afterServe();break;
    case 'svBy':S.svBy=v;try{localStorage.setItem('pos.svBy',v);}catch(x){}renderMain();break;
    case 'svItem':{
      var key=t.dataset.k,grp=itemGroups(S.svType).find(function(x){return x.key===key;});if(!grp)break;
      var per={};grp.entries.forEach(function(e2){if(!lineDone(e2.l))(per[e2.o.id]=per[e2.o.id]||[]).push(e2.l.id);});
      Object.keys(per).forEach(function(oid){markServed(oid,per[oid],S.svType);});
      afterServe(grp.name+' 都出了 ✓');break;}
    case 'noteAdd':addNote();break;
    case 'noteToggle':{
      var n=S.notes.find(function(x){return x.id===id;});if(!n)break;
      n.done=!n.done;n.doneAt=n.done?Date.now():null;renderMain();renderTabs();
      w(function(){return S.db.doc('notes/'+id).update({done:n.done,doneAt:n.doneAt});});break;}
    case 'noteDel':S.notes=S.notes.filter(function(x){return x.id!==id;});renderMain();w(function(){return S.db.doc('notes/'+id).delete();});break;
    case 'noteClear':{
      if(S.confirm!=='noteClear'){arm('noteClear',4000);renderMain();break;}
      S.confirm=null;var ds=S.notes.filter(function(x){return x.done;});
      S.notes=S.notes.filter(function(x){return !x.done;});renderMain();
      w(function(){return Promise.all(ds.map(function(x){return S.db.doc('notes/'+x.id).delete();}));});break;}
    case 'dayPrev':S.salesDay=shiftDay(S.salesDay,-1);renderMain();break;
    case 'dayNext':if(S.salesDay<bizDay()){S.salesDay=shiftDay(S.salesDay,1);renderMain();}break;
    case 'dayToday':S.salesDay=bizDay();renderMain();break;
    case 'setSec':S.setSec=v;renderMain();break;
    case 'logout':if(window.POSAUTH)window.POSAUTH.logout();break;
    case 'mtoggle':mutItem(id,function(m){m.active=m.active===false;});break;
    case 'mtype':mutItem(id,function(m){m.type=itemType(m)==='food'?'drink':'food';});break;
    case 'mdel':
      if(S.confirm==='mdel:'+id){S.confirm=null;mutItem(id,function(m,items){items.splice(items.indexOf(m),1);});}
      else{arm('mdel:'+id,4000);renderMain();}
      break;
    case 'menuAdd':{
      var name=$('#ma-name').value.trim(),cat=$('#ma-cat').value.trim(),pr3=$('#ma-price').value,mt=$('#ma-type').value;
      if(!name){toast('請輸入品名');break;}
      var items=clone(menuItems());
      items.push({id:uid(),name:name,en:'',cat:cat||'未分類',price:pr3===''?null:Math.round(Number(pr3)),active:true,type:mt});
      saveMenu(items);toast('已新增「'+name+'」');break;}
    case 'bulkPrice':{
      var bp=$('#bulk-price').value,bc=$('#bulk-cat').value;
      if(bp===''||Number(bp)<0){toast('請輸入統一價格');break;}
      var cnt=0,price2=Math.round(Number(bp));
      var its=clone(menuItems());its.forEach(function(m){if(m.price==null&&(!bc||m.cat===bc)){m.price=price2;cnt++;}});
      saveMenu(its);toast('已設定 '+cnt+' 款為 '+money(price2));break;}
    case 'regAdd':{
      var rn=$('#ra-name').value.trim(),rt=$('#ra-note').value.trim();
      if(!rn){toast('請輸入名字');break;}
      if(S.regs.some(function(x){return norm(x.name)===norm(rn);})){toast('這位熟客已經在名單裡了');break;}
      saveRegs(S.regs.concat([{id:uid(),name:rn,note:rt,last:0}]));toast('已新增熟客「'+rn+'」');break;}
    case 'regDel':
      if(S.confirm==='rdel:'+id){S.confirm=null;saveRegs(S.regs.filter(function(x){return x.id!==id;}));}
      else{arm('rdel:'+id,4000);renderMain();}
      break;
    case 'tablesReset':S.settings={tables:DEFAULT_TABLES};renderMain();w(function(){return S.db.doc('settings/main').set({tables:DEFAULT_TABLES,updatedAt:Date.now()});});break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,c=t.dataset&&t.dataset.chg;if(!c)return;
  var id=t.dataset.id;
  if(c==='edNote'&&S.editor){S.editor.draft.note=t.value.trim();touch();}
  else if(c==='mname'){var nv=t.value.trim();if(!nv){renderMain();return;}mutItem(id,function(m){m.name=nv;});}
  else if(c==='men'){mutItem(id,function(m){m.en=t.value.trim();});}
  else if(c==='mprice'){mutItem(id,function(m){m.price=t.value===''?null:Math.max(0,Math.round(Number(t.value)));});}
  else if(c==='rname'){var nm=t.value.trim();if(!nm){renderMain();return;}var l1=clone(S.regs);var r1=l1.find(function(x){return x.id===id;});if(r1){r1.name=nm;saveRegs(l1);}}
  else if(c==='rnote'){var l2=clone(S.regs);var r2=l2.find(function(x){return x.id===id;});if(r2){r2.note=t.value.trim();saveRegs(l2);}}
  else if(c==='tables'){
    var arr=t.value.split(/[,，、\n]+/).map(function(x){return x.trim();}).filter(Boolean);
    var seen={},u=[];arr.forEach(function(x){if(!seen[norm(x)]){seen[norm(x)]=1;u.push(x);}});
    if(!u.length){toast('至少要有一個桌位');renderMain();return;}
    S.settings={tables:u};renderMain();toast('桌位已更新');
    w(function(){return S.db.doc('settings/main').set({tables:u,updatedAt:Date.now()});});
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='ed-q'&&S.editor){S.editor.q=t.value;renderEditorPicker();}
  else if(t.id==='m-q'){S.menuQ=t.value;$('#mlist').innerHTML=menuList();}
  else if(t.id==='co-tendered'&&S.co){S.co.tendered=t.value;renderCo();}
  else if(t.id==='p-name'&&S.psheet){
    S.psheet.name=t.value;var ex=S.regs.find(function(r){return norm(r.name)===norm(t.value);});
    S.psheet.rid=ex?ex.id:null;renderP();
  }
  else if(t.id==='t-name'&&S.tsheet){S.tsheet.name=t.value;S.tsheet.rid=null;$('#t-regs').innerHTML=regChips(t.value,null,'tReg');}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var id=e.target.id;
  if(id==='p-name')personOk();
  else if(id==='t-name')renameTo();
  else if(id==='note-input'){e.preventDefault();addNote();}
  else if(id==='ed-ask-price')document.querySelector('[data-act="askOk"]').click();
  else if(id==='ed-cprice')document.querySelector('[data-act="customOk"]').click();
});
window.addEventListener('pagehide',function(){if(S.editor)flushEditor();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&S.editor)flushEditor();});
setInterval(function(){
  var d=bizDay();
  if(S.state==='ready'&&!S.days[d])ensureDay(d);
  renderHeader();
  if((S.view==='serve'||S.view==='tables')&&!S.editor&&!S.co)renderMain();
},60000);

/* ---------- 啟動 ---------- */
render();
(window.POSDB||Promise.resolve(null)).then(function(db){
  if(!db){S.state='none';render();return;}
  startDb(db);
}).catch(function(){S.state='none';render();});
window.__POS=S;
})();
</script>
</body>
